# ============================================
# diagnosis_agent 配置文件
# ============================================

# LLM 配置（阿里云通义千问 Qwen）
# 模型可用性说明（2026-08-18 实测）：
#   ❌ qwen3.7-max — 免费额度已耗尽
#   ❌ qwen-plus — 免费额度已耗尽
#   ❌ qwen2.5-max/qwen2.5-plus/qwen2.5-turbo — 404 不存在
#   ❌ qwen3-max — 免费额度已耗尽
#   ❌ glm5.1 — 不存在
#   ❌ qwen3.5 — 不存在
#   ❌ deepseek-v2 — 不存在
#   ✅ qwen3.5-plus — 主力推荐，聪明且免费额度充足
#   ✅ qwen3.7-max-preview — 可用，长上下文
#   ✅ deepseek-v3.1 — 可用
llm:
  model: "deepseek-v3.1"
  temperature: 0.3
  max_tokens: 4096
  api_key: "${DASHSCOPE_API_KEY}"
  api_base: "${LLM_API_BASE:https://dashscope.aliyuncs.com/compatible-mode/v1}"

# Embedding 配置（阿里云通义千问 Embedding）
embedding:
  provider: "${EMBEDDING_PROVIDER:dashscope}"
  model: "text-embedding-v4"
  api_key: "${DASHSCOPE_API_KEY}"
  api_base: "${LLM_API_BASE:https://dashscope.aliyuncs.com/compatible-mode/v1}"

# 向量数据库配置
vector_store:
  type: "chroma"
  persist_dir: "data/chroma"
  collection_name: "incidents"

# 检索配置
retrieval:
  strategy: "hybrid"
  semantic:
    top_k: 5
    score_threshold: 0.6
  # 两段式检索权重融合（预留，待实现）
  hybrid:
    semantic_weight: 0.7
    filter_weight: 0.3
    filter_expansion_ratio: 2

# Agent 工具默认参数
tools:
  search_top_k: 5

# 报告输出目录
report:
  output_dir: "output"

# 上下文管理配置（分层记忆：热/温/冷）
context:
  # ── Token 预算 ──
  max_tokens: 8000

  # ── 热层配置 ──
  window_size: 15

  # ── 温层配置 ──
  summary_enabled: true
  summary_max_tokens: 500
  summary_strategy: "llm"

  # ── 话题检测配置 ──
  topic_detection_enabled: true
  topic_detection_strategy: "embedding+llm"
  topic_detection_model: "qwen-turbo"
  topic_similarity_high: 0.6
  topic_similarity_low: 0.27

  # ── 话题检测信号词 ──
  topic_signal_words:
    switch:
      - "换一个问题"
      - "换个话题"
      - "新问题"
      - "新场景"
      - "另一个问题"
      - "不是这个"
      - "换一个"
    continue: []

  # ── 实体重叠检测 ──
  entity_overlap_enabled: true

  # ── 时间衰减检测 ──
  topic_time_decay_enabled: true
  topic_time_decay_short_sec: 30
  topic_time_decay_short_max_len: 10
  topic_time_decay_long_sec: 1800

  # ── 领域范围检测（scope） ──
  scope_detection_enabled: true
  scope_use_llm: true
  scope_out_keywords:
    - 电池包
    - 充电桩
    - OBC
    - 音响
    - 空调
    - 外观
    - 娱乐
    - 导航
    - 座椅
    - 车窗
    - 天气
    - 股票
    - 外卖
    - 电影
    - 快递

  # ── 摘要配置 ──
  summary_model: ""

  # ── 生命周期配置 ──
  session_idle_timeout: 3600
  session_max_lifetime: 86400
  chat_idle_timeout: 1800
  emergency_min_turns: 2

  # ── Redis 存储配置 ──
  redis:
    enabled: true
    url: "redis://localhost:6379/0"
    key_prefix: "session:"

  # ── 自适应窗口配置 ──
  adaptive_window:
    enabled: true
    min_window: 2
    max_window: 20
    target_utilization: 0.75
    adjustment_interval: 10

  # ── 数据保留策略配置 ──
  retention:
    retention_days: 30
    max_archive_size_mb: 500
    cleanup_interval_hours: 24

# Neo4j 故障知识图谱配置
neo4j:
  url: "${NEO4J_URI:bolt://localhost:7687}"
  user: "${NEO4J_USER:neo4j}"
  password: "${NEO4J_PASSWORD:sDK2aesu}"
  min_candidates: 3
  default_depth: 1
  fallback_to_chroma: true

# 知识沉淀配置
knowledge:
  enabled: true
  persistence_dir: "cache"
  persistence_file: "conversation_knowledge.json"
  # 专门用于知识提取的模型，实测 deepseek-v3.1 结构化提取效果最佳
  extraction_model: "deepseek-v3.1"
  # 元组解析分隔符配置（不同项目可以自定义，避免输出格式冲突）
  tuple_delimiter: ":"
  record_delimiter: ")"
  completion_delimiter: "返回空列表"
  # Web 审核页面登录（留空则不启用 Basic Auth）
  web_username: ""
  web_password: ""

# 工具调用展示配置
tool_call:
  show_details: true