# ============================================
# diagnosis_agent 配置文件
# ============================================

app:
  name: "diagnosis_agent"
  version: "0.1.0"

# LLM 配置（阿里云通义千问 Qwen）
llm:
  model: "${LLM_MODEL_NAME:qwen-turbo}"
  temperature: 0.3
  max_tokens: 4096
  api_key: "${DASHSCOPE_API_KEY}"
  api_base: "${LLM_API_BASE:https://dashscope.aliyuncs.com/compatible-mode/v1}"

# Embedding 配置（阿里云通义千问 Embedding）
embedding:
  # provider: dashscope（默认，手写 requests，兼容阿里云百炼 input 格式）
  #           openai（走 langchain_openai，仅用于严格兼容 OpenAI tokenizer 的 API）
  provider: "${EMBEDDING_PROVIDER:dashscope}"
  model: "${EMBEDDING_MODEL:text-embedding-v2}"
  api_key: "${DASHSCOPE_API_KEY}"
  api_base: "${LLM_API_BASE:https://dashscope.aliyuncs.com/compatible-mode/v1}"

# 向量数据库配置
vector_store:
  type: "chroma"              # 目前支持 chroma
  persist_dir: "data/chroma"  # ChromaDB 持久化目录
  collection_name: "incidents"

# 检索配置
retrieval:
  # 检索策略：
  # - chroma_only : 只用 Chroma 语义检索（最快，不依赖 Neo4j）
  # - neo4j_first: Neo4j 结构化召回 + Embedding 精排，不足时走 Chroma 兜底
  # - hybrid     : 两段式全开（Neo4j 召回 + 精排 + Chroma 兜底）
  strategy: "neo4j_first"
  semantic:
    top_k: 5                 # 语义检索返回数量
    score_threshold: 0.3     # 相似度阈值（低于此值不返回）
  filter:
    default_top_k: 10
    # 可配置的过滤字段列表 — filter_by() 接受这些字段的任意组合
    # 新增过滤字段只需在此列表追加即可，无需改代码
    filter_fields:
      - vehicle_type
      - drive_code
      - dtc_code
      - dashboard_indicator
      - fault_scenario
  hybrid:
    semantic_weight: 0.7     # 语义检索权重
    filter_weight: 0.3       # 精确过滤权重
    filter_expansion_ratio: 2  # 过滤检索扩倍率（filter_top_k = top_k * 此值）

# Agent 工具默认参数
tools:
  search_top_k: 5            # search_similar_incidents 默认返回数量
  filter_top_k: 10           # filter_by_vehicle_type 默认返回数量

# InputRouter 意图路由配置
input_router:
  enabled: true              # 是否启用意图路由（关闭则所有输入走默认诊断流程）
  model: "${INPUT_ROUTER_MODEL:qwen-turbo}"  # 意图分类用的轻量模型
  temperature: 0.1           # 低温度保证分类稳定性

# Agent 配置
agent:
  max_iterations: 10         # ReAct 最大迭代次数
  verbose: true
  # 有相似工况时的阈值：相似度 >= 此值走"有相似工况"路径
  similarity_threshold: 0.65

# 报告配置
report:
  output_dir: "output"       # 报告输出目录
  markdown_template: "default"

# 路径配置
paths:
  data_dir: "data"
  samples_dir: "data/samples"
  output_dir: "output"

# 上下文管理配置（分层记忆：热/温/冷）
context:
  # ── Token 预算 ──
  max_tokens: 8000     # 消息列表 token 预算上限

  # ── 热层配置 ──
  window_size: 5       # 热层窗口大小（轮次），保留最近 N 轮完整消息

  # ── 温层配置 ──
  summary_enabled: true        # 是否启用摘要（Step 1 实现）
  summary_max_tokens: 500      # 摘要最大 token 数
  summary_strategy: "llm"      # 摘要策略: llm | rule | template

  # ── 话题检测配置 ──
  topic_detection_enabled: true      # 是否启用话题检测
  topic_detection_strategy: "embedding+llm"    # 话题检测策略: embedding | llm | hybrid | rule
  topic_similarity_high: 0.6         # embedding 快筛高阈值（≥此值判 same）
  topic_similarity_low: 0.27         # embedding 快筛低阈值（≤此值判 diff）

  # ── 生命周期配置 ──
  max_turns: 100                   # 最大保留轮次（超过后强制归档）
  session_idle_timeout: 3600       # 会话空闲超时（秒）
  session_max_lifetime: 86400      # 会话最大存活时间（秒）

  # ── 缓存配置 ──
  cache_context_window: 3          # 缓存上下文窗口大小

  # ── 降级配置 ──
  emergency_min_turns: 1           # 紧急截断时保留的最小轮次
  degradation_logging: true        # 是否启用降级日志

# Neo4j 故障知识图谱配置
neo4j:
  url: "${NEO4J_URI:bolt://localhost:7687}"
  user: "${NEO4J_USER:neo4j}"
  password: "${NEO4J_PASSWORD:}"
  min_candidates: 3             # Neo4j 召回少于此数 → 触发 Chroma 兜底
  default_depth: 1             # 默认关系扩展深度（1=直接关系，2=两度关系）
  fallback_to_chroma: true     # Neo4j 不可用时是否降级到 Chroma 语义检索
