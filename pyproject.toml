[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diagnosis_agent"
version = "0.5.0"
description = "故障诊断 Agent — 基于向量检索 + ReAct 推理的双层输出诊断系统"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "diagnosis_agent team"}]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pandas>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "chromadb>=0.4.18",
    "langchain>=1.3.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=0.1.0",
    "langchain-chroma>=1.0.0",
    "langchain-community>=0.1.0",
    "requests>=2.28",
    "neo4j>=5.22.0,<6.0",
    "tiktoken",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
diagnosis-agent = "diagnosis_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
